user:
  # Directory where PDBe-SIFTS writes final results.
  base_dir: null
  # Directory for large cache and temporary files. Prefer a fast scratch or
  # nobackup filesystem when available.
  nobackup_dir: null
  # Search database path used by later build_db / sequence_match workflows.
  # This can stay null during init and be filled after the DB is built.
  target_db: null
  # Local UniProt-to-PDB cross-reference DuckDB. Set automatically by
  # `pdbe_sifts init`.
  unp_pdb_xrefs: null


location:
  base: ${user.base_dir}
  nobackup_dir: ${user.nobackup_dir}

  work:
    base_dir: ${location.base}/release
    data_dir: ${location.work.base_dir}/data
    data_entry_dir: ${location.work.data_dir}/entry


cache:
  base: ${location.nobackup_dir}/sifts_data_cache/
  uniprot: ${cache.base}/uniprot/
  ccd: ${cache.base}/ccd/
  three_to_one: ${cache.base}/three_to_one_letter_mapping.csv


# ---------------------------------------------------------------------------
# Alignment tool parameters
# Modify here to tune sensitivity/speed trade-offs without touching the code.
# ---------------------------------------------------------------------------

alignment:
  mmseqs:
    sensitivity: 5.7        # float, 1–7.5  (higher = more sensitive, slower)
    min_seq_id: 0.9         # float, 0–1    (minimum sequence identity threshold)
    alignment_mode: 3       # int, 0–4      (3 = backtrack; required for qaln/taln)
    db_load_mode: 0         # int, 0–3      (2 = memory-mapped, fastest for repeated searches)
    prefilter_mode: 0       # use 1 for single query search (during the search)
    index_subset: 0         # use 2 for single query search (during build db)
    

  blastp:
    evalue: 10.0            # float         (e-value cut-off for saving hits)
